<body>
<div id="wrap">
  <canvas id="screen"></canvas>
  <div id="pad">
    <div class="dpad">
      <button class="u" data-key="up">▲</button>
      <button class="l" data-key="left">◀</button>
      <button class="r" data-key="right">▶</button>
      <button class="d" data-key="down">▼</button>

    <div class="btns">
      <button class="q" data-key="special">★</button>
      <button class="log" data-key="log">ログ</button>
      <button class="b" data-key="cancel">戻る</button>
      <button class="a" data-key="ok">決定</button>
    </div>
  </div>
</div>
